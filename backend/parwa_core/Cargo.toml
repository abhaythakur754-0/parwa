[package]
name = "parwa_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "parwa_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
ahash = "0.8"
dashmap = "6"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.9"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
bcrypt = "0.17"
sha1 = "0.10"

[dev-dependencies]
