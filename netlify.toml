# Netlify configuration for PARWA frontend (Next.js)
# This ensures Netlify builds only the Next.js frontend and ignores Python backend deps

[build]
  command = "npm run build"
  publish = ".next"
  base = "/"

# Tell Netlify to use Node.js, NOT Python
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Prevent Netlify from auto-detecting and installing Python dependencies
  PYTHON_VERSION = ""
  # Frontend URL for CSRF proxy Origin header — must match backend's trusted origins
  FRONTEND_URL = "https://parwadashboard.netlify.app"

# Use the Essential Next.js plugin for proper SSR/ISR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Context-specific overrides for deploy previews
[context.deploy-preview.environment]
  # Deploy previews get their own URL like fix-branch--parwa.netlify.app
  # The proxy will use the Netlify URL automatically via the fallback chain

[context.production.environment]
  FRONTEND_URL = "https://parwadashboard.netlify.app"
