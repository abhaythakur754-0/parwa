name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: Rust core build + Python lint + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Docker credentials
        run: |
          rm -f ~/.docker/config.json 2>/dev/null || true
          docker logout 2>/dev/null || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Rust toolchain (for parwa_core .so)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend/parwa_core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio maturin
          pip install -r requirements.txt

      - name: Build Rust parwa_core (MANDATORY — fail CI if it doesn't compile)
        run: |
          cd parwa_core
          # Use `maturin build` + `pip install` (not `maturin develop` which needs a virtualenv)
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
          python -c "import parwa_core; assert hasattr(parwa_core, 'RateLimiter'), 'Rust .so missing RateLimiter'"
          echo "Rust parwa_core built and verified"

      - name: Lint with flake8 (syntax + undefined names FAIL the build)
        run: |
          # Hard failures: syntax errors, undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,.venv,__pycache__,dist,build,graphify-out,.git,node_modules,parwa_core
          # Soft warnings: complexity + line length (reported, not fatal)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
            --exclude=venv,.venv,__pycache__,dist,build,graphify-out,.git,node_modules,parwa_core

      - name: Run Unit Tests (no DB required — FAILS on real failures)
        env:
          ENVIRONMENT: test
          SECRET_KEY: fake_secret_for_ci_only
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: fake_jwt_secret_for_ci
          # AI Providers (fake keys — tests that hit real APIs are tagged skip)
          GOOGLE_AI_API_KEY: fake
          CEREBRAS_API_KEY: fake
          GROQ_API_KEY: fake
          OPENROUTER_API_KEY: fake
          OPENROUTER_BASE_URL: https://openrouter.ai
          AI_LIGHT_MODEL: fake
          AI_MEDIUM_MODEL: fake
          AI_HEAVY_MODEL: fake
          AI_FAILOVER_MODEL: fake
          # Voice - Twilio
          TWILIO_ACCOUNT_SID: fake
          TWILIO_AUTH_TOKEN: fake
          TWILIO_PHONE_NUMBER: fake
          TWILIO_API_KEY: fake
          TWILIO_VOICE_WEBHOOK_URL: https://fake
          # Email - Brevo
          BREVO_API_KEY: fake
          # Integrations
          SHOPIFY_API_KEY: fake
          SHOPIFY_API_SECRET: fake
          SHOPIFY_WEBHOOK_SECRET: fake
          MCP_SERVER_URL: https://fake
          MCP_AUTH_TOKEN: fake
          QDRANT_URL: https://fake
          QDRANT_API_KEY: fake
          SENTRY_DSN: https://fake
          GRAFANA_API_KEY: fake
          FROM_EMAIL: fake@parwa.ai
          NEXT_PUBLIC_API_URL: https://fake
          FEATURE_FLAGS_PATH: feature_flags
          MODEL_REGISTRY_PATH: models
          COLAB_WEBHOOK_URL: https://fake
          DATA_ENCRYPTION_KEY: 12345678901234567890123456789012
          PRICING_SIGNING_KEY: dev-ci-pricing-signing-key-for-testing
        run: |
          # Create fake .env for tests
          cat > .env <<EOF
          ENVIRONMENT=test
          SECRET_KEY=fake_secret_for_ci_only
          DATABASE_URL=sqlite:///./test.db
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET_KEY=fake_jwt_secret_for_ci
          GOOGLE_AI_API_KEY=fake
          GROQ_API_KEY=fake
          CEREBRAS_API_KEY=fake
          BREVO_API_KEY=fake
          TWILIO_ACCOUNT_SID=fake
          TWILIO_AUTH_TOKEN=fake
          DATA_ENCRYPTION_KEY=12345678901234567890123456789012
          PRICING_SIGNING_KEY=dev-ci-pricing-signing-key-for-testing
          EOF

          # Run Rust-core activation tests FIRST (fast, catches build regressions)
          python -m pytest ../tests/test_parwa_core_rust.py -v --tb=short --noconftest

          # Keep retired-tier aliases and safe defaults aligned with the pricing contract.
          python -m pytest ../tests/test_mini_removal.py -v --tb=short --noconftest

          # Run unit tests — DB-dependent tests are excluded (they need Docker services).
          # NO `|| true` — real failures now fail the build.
          python -m pytest tests/unit/ -v --tb=short -x \
            --ignore=tests/unit/test_database.py \
            --ignore=tests/unit/test_auth_core.py \
            --ignore=tests/unit/test_billing_service.py \
            --ignore=tests/unit/test_compliance_service.py \
            --ignore=tests/unit/test_escalation_service.py \
            --ignore=tests/unit/test_license_manager.py \
            --ignore=tests/unit/test_license_service.py \
            --ignore=tests/unit/test_licenses.py \
            --ignore=tests/unit/test_mcp_client.py \
            --ignore=tests/unit/test_models.py \
            --ignore=tests/unit/test_monitoring.py \
            --ignore=tests/unit/test_notification_service.py \
            --ignore=tests/unit/test_onboarding_service.py \
            --ignore=tests/unit/test_schemas.py \
            --ignore=tests/unit/test_security.py \
            --ignore=tests/unit/test_sla_service.py \
            --ignore=tests/unit/test_support_service.py \
            --ignore=tests/unit/test_user_service.py

      - name: Live API integration tests (escalation wiring + Phase 2/3 + E2E)
        timeout-minutes: 15
        run: |
          # Boot the real API (schema bootstrap first: lifespan fallbacks cannot
          # create tables on an empty SQLite file)
          export DATABASE_URL="sqlite:///./test.db"
          # E2E script inspects this exact SQLite file (LOCAL_DB default is a dev-sandbox path)
          export LOCAL_DB="$(pwd)/test.db"
          python -c "import sys; sys.path.insert(0,'.'); from database.models import *; from database.base import init_db; init_db()"
          python -m uvicorn app.main:app --port 10000 > server.log 2>&1 &
          SERVER_PID=$!
          UP=0
          for i in $(seq 1 45); do
            sleep 2
            curl -sf http://127.0.0.1:10000/health >/dev/null 2>&1 && UP=1 && break
          done
          if [ "$UP" != "1" ]; then echo "SERVER FAILED"; tail -50 server.log; kill $SERVER_PID; exit 1; fi
          echo "Server healthy"

          # Self-contained regression suites (embedded mock CRM / TestClient)
          python ../scripts/test_crm_return_wiring.py
          python ../scripts/test_phase2_phase3_integration.py

          # Full API E2E: register → ticket → escalate → honest note → resolve
          python ../scripts/test_local_human_replacement.py

          kill $SERVER_PID 2>/dev/null || true

      - name: Build and smoke-test production Redis image
        timeout-minutes: 5
        run: |
          set -eu
          docker build -f ../infra/docker/redis.Dockerfile -t parwa-redis-ci ..
          container="parwa-redis-ci-${GITHUB_RUN_ID}"
          password="$(openssl rand -hex 32)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -e REDIS_PASSWORD="$password" parwa-redis-ci
          ready=0
          for attempt in $(seq 1 20); do
            if docker exec -e REDISCLI_AUTH="$password" "$container" redis-cli ping 2>/dev/null | grep -q PONG; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" sh -c 'grep -Eq "^requirepass [A-Za-z0-9_-]+$" /tmp/redis-runtime.conf'
          unauthenticated_response="$(docker exec -e REDISCLI_AUTH= -e REDIS_PASSWORD= "$container" redis-cli ping 2>&1 || true)"
          if [ "$unauthenticated_response" = "PONG" ]; then
            echo "Redis accepted an unauthenticated command"
            exit 1
          fi
          case "$unauthenticated_response" in
            *NOAUTH*) echo "Unauthenticated Redis access correctly rejected" ;;
            *) echo "Unexpected unauthenticated Redis response: $unauthenticated_response"; exit 1 ;;
          esac
          redis_uid="$(docker exec "$container" id -u)"
          if [ "$redis_uid" = "0" ]; then
            echo "Redis is running as root"
            exit 1
          fi
          redis_args="$(docker exec "$container" sh -c "ps w | grep '[r]edis-server'")"
          if printf '%s' "$redis_args" | grep -F "$password"; then
            echo "Redis password leaked in process arguments"
            exit 1
          fi
          echo "Redis image authentication, non-root execution, and argv secrecy verified"

      - name: Test Summary
        if: always()
        run: echo "Backend tests completed"

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: lint + type-check + build + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    outputs:
      lint_outcome: ${{ steps.lint.outcome }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: "Run Linter (required)"
        id: lint
        run: npx eslint . --max-warnings=0

      - name: Type Check (FAILS on type errors)
        run: bun run type-check

      - name: Build Frontend (FAILS on build errors)
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://fake
          DATABASE_URL: file:./test.db

      - name: Run Jarvis production-guard regression test (required)
        run: npx jest src/lib/jarvis/__tests__/legacy-guest-guard.test.ts --runInBand

      - name: Run Vitest chat API regression
        run: bunx vitest run src/app/api/chat/__tests__/jarvis-fallback.test.ts

      - name: Run Frontend Unit Suite (required)
        run: npx jest --passWithNoTests

      # Run actual browser navigation against a live Next.js dev server.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run real-browser smoke tests
        run: bunx playwright test tests/e2e/ci-smoke.spec.ts tests/e2e/auth-redirect-verification.spec.ts tests/e2e/usage-warning-modal.spec.ts --project=chromium
        env:
          NEXT_PUBLIC_API_URL: https://fake
          DATABASE_URL: file:./test.db

      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parwa-browser-smoke-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Frontend Test Summary
        if: always()
        run: echo "Frontend tests completed"

  # Produce a reproducible source snapshot only after both required CI jobs pass.
  package-source:
    name: Package verified source snapshot
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: needs.test-frontend.outputs.lint_outcome == 'success'
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4

      - name: Create source archive and provenance
        run: |
          set -eu
          printf 'commit=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > BUILD_INFO.txt
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          from zipfile import ZIP_DEFLATED, ZipFile

          excluded = {
              "venv", ".venv", "node_modules", ".next", "__pycache__",
              ".pytest_cache", "coverage", "dist", "build",
          }
          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")

          with ZipFile("parwa-source.zip", "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for raw_path in tracked:
                  if not raw_path:
                      continue
                  path = raw_path.decode("utf-8")
                  if any(part in excluded for part in PurePosixPath(path).parts):
                      continue
                  archive.write(path, path)
              archive.write("BUILD_INFO.txt", "BUILD_INFO.txt")
          PY
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          from pathlib import Path

          with ZipFile("parwa-source.zip") as archive:
              names = archive.namelist()
              required = {
                  "BUILD_INFO.txt",
                  "package.json",
                  "backend/requirements.txt",
                  "src/lib/variant-store.ts",
              }
              missing = required.difference(names)
              if missing:
                  raise SystemExit(f"Source archive is missing required files: {sorted(missing)}")
              if len(names) < 1000 or Path("parwa-source.zip").stat().st_size < 1_000_000:
                  raise SystemExit("Source archive is unexpectedly small or incomplete")
              if archive.testzip() is not None:
                  raise SystemExit("Source archive failed ZIP integrity verification")
              if any(part in {"venv", ".venv", "node_modules"} for name in names for part in PurePosixPath(name).parts):
                  raise SystemExit("Source archive unexpectedly contains generated dependency directories")
          PY

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: parwa-source-${{ github.sha }}
          path: |
            parwa-source.zip
            BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
