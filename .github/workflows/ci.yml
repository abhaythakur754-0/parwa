name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: Rust core build + Python lint + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Docker credentials
        run: |
          rm -f ~/.docker/config.json 2>/dev/null || true
          docker logout 2>/dev/null || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Rust toolchain (for parwa_core .so)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend/parwa_core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio maturin
          pip install -r requirements.txt

      - name: Build Rust parwa_core (MANDATORY — fail CI if it doesn't compile)
        run: |
          cd parwa_core
          # Use `maturin build` + `pip install` (not `maturin develop` which needs a virtualenv)
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
          python -c "import parwa_core; assert hasattr(parwa_core, 'RateLimiter'), 'Rust .so missing RateLimiter'"
          echo "Rust parwa_core built and verified"

      - name: Lint with flake8 (syntax + undefined names FAIL the build)
        run: |
          # Hard failures: syntax errors, undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,.venv,__pycache__,dist,build,graphify-out,.git,node_modules,parwa_core
          # Soft warnings: complexity + line length (reported, not fatal)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
            --exclude=venv,.venv,__pycache__,dist,build,graphify-out,.git,node_modules,parwa_core

      - name: Run Unit Tests (no DB required — FAILS on real failures)
        env:
          ENVIRONMENT: test
          SECRET_KEY: fake_secret_for_ci_only
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: fake_jwt_secret_for_ci
          # AI Providers (fake keys — tests that hit real APIs are tagged skip)
          GOOGLE_AI_API_KEY: fake
          CEREBRAS_API_KEY: fake
          GROQ_API_KEY: fake
          OPENROUTER_API_KEY: fake
          OPENROUTER_BASE_URL: https://openrouter.ai
          AI_LIGHT_MODEL: fake
          AI_MEDIUM_MODEL: fake
          AI_HEAVY_MODEL: fake
          AI_FAILOVER_MODEL: fake
          # Voice - Twilio
          TWILIO_ACCOUNT_SID: fake
          TWILIO_AUTH_TOKEN: fake
          TWILIO_PHONE_NUMBER: fake
          TWILIO_API_KEY: fake
          TWILIO_VOICE_WEBHOOK_URL: https://fake
          # Email - Brevo
          BREVO_API_KEY: fake
          # Integrations
          SHOPIFY_API_KEY: fake
          SHOPIFY_API_SECRET: fake
          SHOPIFY_WEBHOOK_SECRET: fake
          MCP_SERVER_URL: https://fake
          MCP_AUTH_TOKEN: fake
          QDRANT_URL: https://fake
          QDRANT_API_KEY: fake
          SENTRY_DSN: https://fake
          GRAFANA_API_KEY: fake
          FROM_EMAIL: fake@parwa.ai
          NEXT_PUBLIC_API_URL: https://fake
          FEATURE_FLAGS_PATH: feature_flags
          MODEL_REGISTRY_PATH: models
          COLAB_WEBHOOK_URL: https://fake
          DATA_ENCRYPTION_KEY: 12345678901234567890123456789012
          PRICING_SIGNING_KEY: dev-ci-pricing-signing-key-for-testing
        run: |
          # Create fake .env for tests
          cat > .env <<EOF
          ENVIRONMENT=test
          SECRET_KEY=fake_secret_for_ci_only
          DATABASE_URL=sqlite:///./test.db
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET_KEY=fake_jwt_secret_for_ci
          GOOGLE_AI_API_KEY=fake
          GROQ_API_KEY=fake
          CEREBRAS_API_KEY=fake
          BREVO_API_KEY=fake
          TWILIO_ACCOUNT_SID=fake
          TWILIO_AUTH_TOKEN=fake
          DATA_ENCRYPTION_KEY=12345678901234567890123456789012
          PRICING_SIGNING_KEY=dev-ci-pricing-signing-key-for-testing
          EOF

          # Run Rust-core activation tests FIRST (fast, catches build regressions)
          python -m pytest ../tests/test_parwa_core_rust.py -v --tb=short --noconftest

          # Run unit tests — DB-dependent tests are excluded (they need Docker services).
          # NO `|| true` — real failures now fail the build.
          python -m pytest tests/unit/ -v --tb=short -x \
            --ignore=tests/unit/test_database.py \
            --ignore=tests/unit/test_auth_core.py \
            --ignore=tests/unit/test_billing_service.py \
            --ignore=tests/unit/test_compliance_service.py \
            --ignore=tests/unit/test_escalation_service.py \
            --ignore=tests/unit/test_license_manager.py \
            --ignore=tests/unit/test_license_service.py \
            --ignore=tests/unit/test_licenses.py \
            --ignore=tests/unit/test_mcp_client.py \
            --ignore=tests/unit/test_models.py \
            --ignore=tests/unit/test_monitoring.py \
            --ignore=tests/unit/test_notification_service.py \
            --ignore=tests/unit/test_onboarding_service.py \
            --ignore=tests/unit/test_schemas.py \
            --ignore=tests/unit/test_security.py \
            --ignore=tests/unit/test_sla_service.py \
            --ignore=tests/unit/test_support_service.py \
            --ignore=tests/unit/test_user_service.py

      - name: Test Summary
        if: always()
        run: echo "Backend tests completed"

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: lint + type-check + build + unit tests
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter (FAILS on errors)
        run: npx eslint . --max-warnings=0
        continue-on-error: true  # TODO: enforce once all existing warnings are fixed

      - name: Type Check (FAILS on type errors)
        run: bun run type-check
        continue-on-error: true  # TODO: enforce once tsconfig strict is cleaned up

      - name: Build Frontend (FAILS on build errors)
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://fake
          DATABASE_URL: file:./test.db

      - name: Run Unit Tests (FAILS on failures)
        # Run only Jest tests (not Playwright e2e — those need a running server)
        run: npx jest --testPathIgnorePatterns="tests/e2e/" --passWithNoTests
        continue-on-error: true  # TODO: enforce once Mini/Onboarding-Jarvis cleanup lands

      - name: Frontend Test Summary
        if: always()
        run: echo "Frontend tests completed"
