name: Focused MFA Security Regression

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/auth_service.py"
      - "backend/app/api/auth.py"
      - "backend/app/api/mfa.py"
      - "backend/app/schemas/mfa.py"
      - "backend/tests/unit/test_mfa_login_enforcement_security.py"
      - "backend/tests/unit/test_mfa_session_storage_security.py"
      - "src/app/api/auth/login/route.ts"
      - "src/app/api/mfa/**"
      - "src/app/(auth)/login/page.tsx"
      - "src/app/auth/mfa-verify/page.tsx"
      - "src/lib/mfa-store.ts"
      - "src/lib/__tests__/mfa-store.test.ts"
      - "src/__tests__/integration/settings-mfa-email-flow.test.ts"
      - ".github/workflows/security-mfa-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/services/auth_service.py"
      - "backend/app/api/auth.py"
      - "backend/app/api/mfa.py"
      - "backend/app/schemas/mfa.py"
      - "backend/tests/unit/test_mfa_login_enforcement_security.py"
      - "backend/tests/unit/test_mfa_session_storage_security.py"
      - "src/app/api/auth/login/route.ts"
      - "src/app/api/mfa/**"
      - "src/app/(auth)/login/page.tsx"
      - "src/app/auth/mfa-verify/page.tsx"
      - "src/lib/mfa-store.ts"
      - "src/lib/__tests__/mfa-store.test.ts"
      - "src/__tests__/integration/settings-mfa-email-flow.test.ts"
      - ".github/workflows/security-mfa-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mfa-login-security:
    name: MFA login security regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused MFA security contracts
        run: python -m pytest --noconftest tests/unit/test_mfa_login_enforcement_security.py tests/unit/test_mfa_session_storage_security.py -q --tb=short

  mfa-frontend-contracts:
    name: MFA frontend route and store regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Run MFA store and login integration tests
        run: bunx jest src/lib/__tests__/mfa-store.test.ts src/__tests__/integration/settings-mfa-email-flow.test.ts --runInBand

  package-verified-source:
    name: Package verified source snapshot
    runs-on: ubuntu-latest
    needs: [mfa-login-security, mfa-frontend-contracts]
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Create source archive and provenance
        run: |
          set -eu
          python - <<'PY'
          import os
          import subprocess
          from zipfile import ZIP_DEFLATED, ZipFile

          with open("BUILD_INFO.txt", "w", encoding="utf-8") as info:
              info.write("commit=" + os.environ["GITHUB_SHA"] + chr(10))
              info.write("branch=" + os.environ["GITHUB_REF_NAME"] + chr(10))
          excluded = {"venv", ".venv", "node_modules", ".next", "__pycache__", ".pytest_cache", "coverage", "dist", "build"}
          tracked = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True).stdout.split(bytes([0]))
          with ZipFile("parwa-source.zip", "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for raw in tracked:
                  if not raw:
                      continue
                  path = raw.decode("utf-8")
                  if any(part in excluded for part in path.split("/")):
                      continue
                  archive.write(path, arcname=path)
          PY
      - name: Upload verified source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: parwa-source-${{ github.sha }}
          path: |
            parwa-source.zip
            BUILD_INFO.txt
          retention-days: 30
