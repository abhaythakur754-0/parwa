# PARWA — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# This file defines the Render deployment configuration.
# Build context is backend/ so COPY . . gets backend code.
#
# DATABASE: Supabase PostgreSQL (external) — NOT Render internal DB.
# Set DATABASE_URL manually on Render Dashboard → parwa-backend → Environment.
# The parwa-db Render service/database has been REMOVED (replaced by Supabase).

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: parwa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildContext: ./backend
    plan: starter
    region: oregon
    branch: main
    # Skip Rust compilation for faster deploys (2-3 min instead of 10-15 min)
    # The pure-Python fallback provides the same functionality.
    dockerBuildArgs:
      - key: SKIP_RUST_BUILD
        value: "true"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: 8000
      # ── Database: Supabase PostgreSQL ──
      # IMPORTANT: Set this on Render Dashboard → parwa-backend → Environment
      # Format: postgresql://postgres.PROJECT_REF:PASSWORD@aws-1-REGION.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      # ── Supabase REST API (for Jarvis DB / Escalation Vault) ──
      # Get from: Supabase Dashboard → Settings → API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ── Redis (Render internal) ──
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      # Set the same high-entropy password on the Redis service and both clients.
      - key: REDIS_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # External agent-building and tool-execution credentials (environment-only).
      - key: BUILDER_API_KEY
        sync: false
      - key: SUPERGLUE_API_URL
        sync: false
      - key: SUPERGLUE_AUTH_TOKEN
        sync: false
      - key: SUPERGLUE_LLM_API_KEY
        sync: false
      - key: SUPERGLUE_SESSION_ID
        sync: false
      - key: PRICING_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        value: https://parwa.buzz,https://parwa.vercel.app
      - key: FRONTEND_URL
        value: https://parwa.buzz
      # Provider voice webhooks (Twilio speech/status callbacks) MUST land on
      # the Python backend host, not the frontend. Used for gather + status URLs.
      - key: BACKEND_PUBLIC_URL
        value: https://parwa-backend.onrender.com
      # Keep ticket pipeline dispatch on the DB-backed polling worker pool.
      # The separate Celery worker remains available for other background queues;
      # this avoids coupling ticket creation to broker availability on the Starter plan.
      - key: FORCE_SYNC_PIPELINE
        value: "true"
      # Starter is 512 MB RAM. The pipeline's own memory notes show
      # 10 concurrent pipelines OOM-kill this service; keep 3 base workers
      # and disable overflow until the service is upgraded.
      - key: MAX_CONCURRENT_PIPELINES
        value: "3"
      - key: SPARE_CAPACITY_WORKERS
        value: "0"
      # LLM Provider API Keys (3 providers for 11-model Smart Router)
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── Mistral AI (60 RPM, free, permanent) ──
      - key: MISTRAL_API_KEY
        sync: false
      # ── Aion Labs (15 RPM, free) ──
      - key: AION_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # LLM Models (user-validated: llama-3.1-8b for all tasks, gpt-oss-120b for guardrail)
      - key: AI_LIGHT_MODEL
        value: "groq/llama-3.1-8b"
      - key: AI_MEDIUM_MODEL
        value: "groq/llama-3.1-8b"
      - key: AI_HEAVY_MODEL
        value: "groq/gpt-oss-120b"
      - key: AI_FAILOVER_MODEL
        value: "groq/llama-3.1-8b"
      - key: LLM_PROVIDER
        value: "litellm"
      - key: PARWA_SKIP_GLM
        value: "1"
    healthCheckPath: /health

  # ── Celery Worker ───────────────────────────────────────────
  - type: worker
    name: parwa-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.celery
    buildContext: ./backend
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app
      # ── Database: Supabase PostgreSQL ──
      # IMPORTANT: Set this on Render Dashboard → parwa-worker → Environment
      # Same value as parwa-backend DATABASE_URL
      - key: DATABASE_URL
        sync: false
      # ── Supabase REST API ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ── Redis (Render internal) ──
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: REDIS_PASSWORD
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PRICING_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # ── LLM provider keys (CRITICAL) ──
      # The 8-node AI pipeline runs in THIS worker, not the web service.
      # Without these, every ticket fails with "LLM call failed: all
      # providers exhausted". Same values as parwa-backend.
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  # ── Redis ───────────────────────────────────────────────────
  - type: pserv
    name: parwa-redis
    runtime: docker
    dockerfilePath: ./infra/docker/redis.Dockerfile
    buildContext: .
    plan: starter
    region: oregon
    envVars:
      - key: REDIS_PASSWORD
        sync: false

# NOTE: Render internal PostgreSQL (parwa-db) has been REMOVED.
# PARWA now uses Supabase for PostgreSQL. Set DATABASE_URL env var
# manually on Render Dashboard for both parwa-backend and parwa-worker.
#
# To fully clean up, delete the parwa-db service on Render Dashboard
# if it still exists from a previous deployment.
