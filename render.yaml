# PARWA — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# This file defines the Render deployment configuration.
# Build context is backend/ so COPY . . gets backend code.
#
# DATABASE: Supabase PostgreSQL (external) — NOT Render internal DB.
# Set DATABASE_URL manually on Render Dashboard → parwa-backend → Environment.
# The parwa-db Render service/database has been REMOVED (replaced by Supabase).

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: parwa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    buildContext: ./backend
    plan: starter
    region: oregon
    branch: main
    # Skip Rust compilation for faster deploys (2-3 min instead of 10-15 min)
    # The pure-Python fallback provides the same functionality.
    dockerBuildArgs:
      - key: SKIP_RUST_BUILD
        value: "true"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: 8000
      # ── Database: Supabase PostgreSQL ──
      # IMPORTANT: Set this on Render Dashboard → parwa-backend → Environment
      # Format: postgresql://postgres.PROJECT_REF:PASSWORD@aws-1-REGION.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      # ── Supabase REST API (for Jarvis DB / Escalation Vault) ──
      # Get from: Supabase Dashboard → Settings → API
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ── Redis (Render internal) ──
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PRICING_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://parwa.buzz,https://parwa.vercel.app
      - key: FRONTEND_URL
        value: https://parwa.buzz
      # Run pipeline synchronously in the request thread instead of dispatching
      # to Celery. Celery is unhealthy on Render free tier (no separate worker
      # service); sync is slower (3-5s per ticket) but RELIABLE — no 503s on
      # ticket creation when Celery can't connect to Redis.
      - key: FORCE_SYNC_PIPELINE
        value: "true"
      # Concurrent pipeline workers (10 = assembly line model).
      - key: MAX_CONCURRENT_PIPELINES
        value: "10"
      # LLM Provider API Keys (3 providers for 11-model Smart Router)
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── Mistral AI (60 RPM, free, permanent) ──
      - key: MISTRAL_API_KEY
        sync: false
      # ── Aion Labs (15 RPM, free) ──
      - key: AION_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # LLM Models (user-validated: llama-3.1-8b for all tasks, gpt-oss-120b for guardrail)
      - key: AI_LIGHT_MODEL
        value: "groq/llama-3.1-8b"
      - key: AI_MEDIUM_MODEL
        value: "groq/llama-3.1-8b"
      - key: AI_HEAVY_MODEL
        value: "groq/gpt-oss-120b"
      - key: AI_FAILOVER_MODEL
        value: "groq/llama-3.1-8b"
      - key: LLM_PROVIDER
        value: "litellm"
      - key: PARWA_SKIP_GLM
        value: "1"
    healthCheckPath: /health

  # ── Celery Worker ───────────────────────────────────────────
  - type: worker
    name: parwa-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.celery
    buildContext: ./backend
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app
      # ── Database: Supabase PostgreSQL ──
      # IMPORTANT: Set this on Render Dashboard → parwa-worker → Environment
      # Same value as parwa-backend DATABASE_URL
      - key: DATABASE_URL
        sync: false
      # ── Supabase REST API ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ── Redis (Render internal) ──
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: CELERY_BROKER_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PRICING_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false

  # ── Redis ───────────────────────────────────────────────────
  - type: pserv
    name: parwa-redis
    runtime: docker
    dockerfilePath: ./infra/docker/redis.Dockerfile
    buildContext: .
    plan: starter
    region: oregon

# NOTE: Render internal PostgreSQL (parwa-db) has been REMOVED.
# PARWA now uses Supabase for PostgreSQL. Set DATABASE_URL env var
# manually on Render Dashboard for both parwa-backend and parwa-worker.
#
# To fully clean up, delete the parwa-db service on Render Dashboard
# if it still exists from a previous deployment.
