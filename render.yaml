# PARWA — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# This file defines the Render deployment configuration.
# It ensures the Docker build context is the repo root,
# so requirements.txt and other shared files are available.

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: parwa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Build context is repo root so requirements.txt is available
    buildContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app:/app/backend
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: parwa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://parwa.buzz,https://parwa.ai
      - key: FRONTEND_URL
        value: https://parwa.buzz
    healthCheckPath: /health

  # ── Celery Worker ───────────────────────────────────────────
  - type: worker
    name: parwa-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.celery
    buildContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: /app:/app/backend
      - key: DATABASE_URL
        fromDatabase:
          name: parwa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: CELERY_BROKER_URL
        fromService:
          name: parwa-redis
          type: pserv
          property: connectionstring
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false

  # ── Redis ───────────────────────────────────────────────────
  - type: pserv
    name: parwa-redis
    runtime: docker
    dockerfilePath: ./infra/docker/redis.Dockerfile
    buildContext: .
    plan: starter
    region: oregon

  # ── PostgreSQL Database ─────────────────────────────────────
  - type: pserv
    name: parwa-db
    runtime: docker
    dockerfilePath: ./infra/docker/postgres.Dockerfile
    buildContext: .
    plan: starter
    region: oregon

databases:
  - name: parwa-db
    databaseName: parwa_db
    plan: starter
    region: oregon
