# ─────────────────────────────────────────────────────────────
# PARWA — Render.com Deployment Configuration
# ─────────────────────────────────────────────────────────────
# Free tier: 750 hours/month (enough for 1 web + 1 worker)
# Backend sleeps after 15 min inactivity — use UptimeRobot to keep warm
# Uses Docker runtime to guarantee Python 3.11 (Render's Python
# runtime ignores runtime.txt and defaults to 3.14, breaking pydantic)
# ─────────────────────────────────────────────────────────────

services:
  # ── FastAPI Backend ──────────────────────────────────────
  - type: web
    name: parwa-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    rootDir: backend
    envVars:
      - key: ENVIRONMENT
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: LLM_PROVIDER
        value: "litellm"
      - key: LLM_PRIMARY_PROVIDER
        value: "google"
      - key: LLM_FALLBACK_PROVIDER
        value: "groq"
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_IDS
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PRICING_SIGNING_KEY
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: NEXT_PUBLIC_PADDLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CSRF_ENABLED
        value: "true"
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Celery Worker ────────────────────────────────────────
  - type: worker
    name: parwa-worker
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.celery
    rootDir: backend
    envVars:
      - key: ENVIRONMENT
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: LLM_PROVIDER
        value: "litellm"
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
